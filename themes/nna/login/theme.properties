# NNA login theme (2026-11-10) – the look of the app's sign-in on the globe (Yiğit's design): light background,
# "Welcome to / NEB Network" in Space Grotesk, underlined inputs, dark pill buttons, outlined Apple/Google pills.
# Only CSS on top of Keycloak's own login theme, so its pages (login, register, reset, verify e-mail …) all fit.
parent=keycloak.v2
import=common/keycloak
# ?v=… : Keycloak serves theme files under /resources/<Keycloak version>/ with a cache of weeks – without a new tag
# browsers keep the OLD nna.css after a theme change (the page then looks broken). Raise it with every CSS change.
styles=css/styles.css css/fonts.css?v=20261111c css/nna.css?v=20261111c
darkMode=false
